name: Sonarqube Analysis
on:
  push:
    branches:
      - main
 workflow_dispatch:
jobs:
  unit-testing:
    name: unit-testing
    runs-on: ubntu-latest
    steps:
      # step-1 checkout the code
      - name: check-out the code
        uses: actions/checkout@v4
      # step-2 setup the node environment
      - name: setup node environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
      # step-3 install dependicens
      - name: install dependicines
        run: npm install
      # step-4 run unit testing
      - name: unit testing
        run: npm test
      # step-5 upload test results
      - name: upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage
          retention-days: 5
  Sonarqube-analysis:
    name: Sonarqube analysis
    runs-on: ubntu-latest
    steps:
      #step-1 checkout the code
      - name: checkout the code
        uses: actions\checkout@v4
      # step-2 setup the node environment
      - name: setup node environment
        uses: actions\setup-node@v4
        with:
          node-version: 20
      # step-4 install dependiciens
      - name: install dependicines
        run: npm install
      # step-5 Download the results
      - name: download the results
        uses: actions\download-artifact@v4
        with:
          name: test-results
          path: coverage    
      # step-6 run sonarqube analysis
      - name: run sonarqube analysis
        uses: sonarsource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_HOST_URL: ${{ secrets.SONARQUBE_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=sonarqube project1
            -Dsonar.projectName="sonarqube project1"
            -Dsonar.projectVersion=1.0
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.test.inclusions=tests/**/*.test.js
            -Dsonar.exclusions=node_modules/**,coverage/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
        # step-6 sonarqube quality gate  
      - name: sonarqube quality gates 
        uses: sonarsource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_HOST_URL: ${{ secrets.SONARQUBE_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          







