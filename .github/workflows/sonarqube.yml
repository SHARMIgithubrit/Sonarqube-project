
name: Sonarqube Analysis

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  unit-testing:
    name: unit-testing
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: check-out the code
        uses: actions/checkout@v4

      # Step 2: Setup the Node environment
      - name: setup node environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 3: Install dependencies
      - name: install dependencies
        run: npm install

      # Step 4: Run unit testing
      - name: unit testing
        run: npm test

      # Step 5: Upload test results
      - name: upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage
          retention-days: 5

  Sonarqube-analysis:
    name: Sonarqube analysis
    runs-on: ubuntu-latest
    needs: unit-testing

    steps:
      # Step 1: Checkout the code
      - name: checkout the code
        uses: actions/checkout@v4

      # Step 2: Setup the Node environment
      - name: setup node environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 3: Install dependencies
      - name: install dependencies
        run: npm install

      # Step 4: Download the results
      - name: download the results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: coverage

      # Step 5: Run SonarQube analysis
      - name: run sonarqube analysis
        uses: sonarsource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_HOST_URL: ${{ secrets.SONARQUBE_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=sonarqube-project1
            -Dsonar.projectName="sonarqube project1"
            -Dsonar.projectVersion=1.0
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.test.inclusions=tests/**/*.test.js
            -Dsonar.exclusions=node_modules/**,coverage/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

      # Step 6: SonarQube Quality Gate
      - name: sonarqube quality gates
        uses: sonarsource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_HOST_URL: ${{ secrets.SONARQUBE_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
